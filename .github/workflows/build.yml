# À placer dans le dépôt sous : .github/workflows/build.yml
# Lancement manuel : onglet Actions > "Build APK" > Run workflow
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          # Version figée : le projet utilise Gradle 8.14 / AGP 8.11 (Flutter 3.38).
          # La toute dernière version de Flutter exige Gradle 9.3.1 et fait échouer la compilation.
          flutter-version: 3.38.x
          channel: stable
          cache: true

      # Optionnel : signature stable (voir le guide). Sans le secret, cette étape ne fait rien.
      - name: Clé de signature stable
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Clé de signature restaurée."
          else
            echo "Aucun secret DEBUG_KEYSTORE_BASE64 : signature aléatoire."
          fi

      - name: Version de Flutter utilisée (pour diagnostic)
        run: flutter --version

      - name: Dépendances
        run: flutter pub get

      - name: Compiler les APK (un par processeur)
        run: flutter build apk --release --split-per-abi

      - name: Garder les APK (téléchargeables depuis la page de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*-release.apk
          
